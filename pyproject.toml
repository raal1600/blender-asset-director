[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-asset-director"
version = "0.4.0"
description = "Reuse-first Blender asset discovery, motion indexing and validated adaptation"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
asset-director = "asset_director.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
