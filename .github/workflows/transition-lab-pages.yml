name: Transition Lab · Build and publish
on:
  push:
    branches: [main, 'showcase/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transition-lab-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression and packaging gates
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python tools/install_skill.py --self-test
      - name: Fetch checksum-verified Blender and pinned retarget backend
        run: |
          python tools/fetch_blender.py '5.2.1' "$RUNNER_TEMP/blender" > blender-path.txt
          echo "BLENDER=$(tail -n 1 blender-path.txt)" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          PYTHONPATH=src python -m asset_director --library "$RUNNER_TEMP/showcase-library" backend-install
      - name: Generate and verify the actual synthetic full-length sequence
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/sequence_fixture.py -- "$RUNNER_TEMP/showcase-fixture" "$RUNNER_TEMP/showcase-library"
      - name: Render four real Blender-evaluated methods (480 bounded CPU frames)
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/transition_showcase.py -- "$RUNNER_TEMP/showcase-library" "$RUNNER_TEMP/showcase-fixture" "$RUNNER_TEMP/showcase-render"
      - name: Encode technical lab and assemble site
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python tools/build_transition_site.py "$RUNNER_TEMP/showcase-render" "$RUNNER_TEMP/web/blender-asset-director"
      - name: Add latest real showcase as the landing page
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'web' / 'blender-asset-director'
          technical = root / 'technical-validation'
          technical.mkdir()
          for p in list(root.iterdir()):
              if p.name != 'technical-validation':
                  p.rename(technical / p.name)
          payload = base64.b64decode(Path('showcase/latest-demo-web.b64').read_text().strip(), validate=True)
          assert len(payload) > 100000
          (root / 'latest-demo.mp4').write_bytes(payload)
          poster = Path('showcase/latest-demo-poster.svg').read_text()
          (root / 'latest-demo-poster.svg').write_text(poster)
          (root / 'index.html').write_text('''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blender Asset Director · Latest showcase</title><style>body{margin:0;background:#0b1220;color:#e5e7eb;font:16px system-ui,sans-serif}.wrap{max-width:1040px;margin:auto;padding:36px 20px}h1{font-size:clamp(32px,6vw,64px);margin:.2em 0}p{color:#cbd5e1;line-height:1.6}video{width:100%;background:#000;border-radius:18px;box-shadow:0 20px 60px #0008}.links{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}.links a{color:white;background:#2563eb;padding:12px 18px;border-radius:10px;text-decoration:none}.links a.alt{background:#334155}.note{font-size:14px;color:#94a3b8}</style></head><body><main class="wrap"><p>Blender Asset Director</p><h1>Latest real motion showcase</h1><p>Moonwalk → Thriller · Cut, NLA, Aligned and Director. Four seconds including the transition, from the latest verified private acceptance recording.</p><video controls playsinline preload="metadata" poster="latest-demo-poster.svg"><source src="latest-demo.mp4" type="video/mp4">Your browser does not support H.264 video.</video><div class="links"><a href="latest-demo.mp4">Open video</a><a class="alt" href="technical-validation/">Technical Transition Lab</a><a class="alt" href="https://github.com/raal1600/blender-asset-director">Repository</a></div><p class="note">Public showcase derivative only. Original source FBXs, Blender projects and private reports remain private.</p></main></body></html>''')
          PY
      - name: Verify public showcase derivative
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration -of default=nw=1 "$RUNNER_TEMP/web/blender-asset-director/latest-demo.mp4" | tee "$RUNNER_TEMP/showcase-probe.txt"
          grep -q '^codec_name=h264$' "$RUNNER_TEMP/showcase-probe.txt"
          python - <<'PY'
          import subprocess, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'web','blender-asset-director','latest-demo.mp4')
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',p],text=True))
          assert 3.9 <= d <= 4.1, d
          PY
          grep -q 'technical-validation/' "$RUNNER_TEMP/web/blender-asset-director/index.html"
      - name: Retain encoded public website before browser validation
        uses: actions/upload-artifact@v4
        with:
          name: transition-lab-render
          path: ${{ runner.temp }}/web/blender-asset-director/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse this run's completed site
        uses: actions/download-artifact@v4
        with:
          name: transition-lab-render
          path: ${{ runner.temp }}/web/blender-asset-director
      - name: Test technical lab browser behavior
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chrome
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/web" > "$RUNNER_TEMP/http.log" 2>&1 &
          python tools/test_transition_page.py http://127.0.0.1:8765/blender-asset-director/technical-validation/ "$RUNNER_TEMP/page-evidence"
      - name: Test latest showcase video playback
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  page=await b.new_page(viewport={'width':390,'height':844})
                  await page.goto('http://127.0.0.1:8765/blender-asset-director/', wait_until='networkidle')
                  assert await page.locator('video').count() == 1
                  await page.locator('video').evaluate('(v)=>v.play()')
                  await page.wait_for_timeout(1200)
                  t=await page.locator('video').evaluate('(v)=>v.currentTime')
                  assert t > 0.2, t
                  assert await page.locator('a[href="technical-validation/"]').count() == 1
                  await b.close()
          asyncio.run(main())
          PY
      - name: Retain browser evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transition-lab-browser-evidence
          path: ${{ runner.temp }}/page-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload only the validated public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/web/blender-asset-director
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration (do not alter repository settings)
        uses: actions/configure-pages@v5
      - name: Deploy validated showcase and Transition Lab
        id: deployment
        uses: actions/deploy-pages@v4
