name: Transition Lab · Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transition-lab-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/e2e-showcase.yml
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download this run's validated public website
        uses: actions/download-artifact@v4
        with:
          name: transition-lab-render
          path: public-site
      - name: Package only the validated website for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Read existing Pages configuration (do not alter repository settings)
        uses: actions/configure-pages@v5
      - name: Deploy validated showcase and Transition Lab
        id: deployment
        uses: actions/deploy-pages@v4
