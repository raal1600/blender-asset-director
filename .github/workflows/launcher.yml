name: Checks · Launcher contracts and Windows build
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    name: Real launcher contracts and Windows executable build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Synthetic launcher and lifecycle tests
        working-directory: launcher
        run: node --test
      - name: Build desktop executable with pinned WebView2 SDK
        shell: powershell
        run: ./launcher/tools/build-launcher.ps1 -RestoreDependencies
