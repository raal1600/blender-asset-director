name: Verified preview release
on:
  push:
    branches: [main]
    paths: ['release-request.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release request
        id: request
        shell: python
        run: |
          import json, os, re, tomllib
          version = json.load(open('release-request.json'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert version == tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('tag=v' + version + '\n')
      - name: Build tracked-source package
        run: python tools/package_release.py --output dist
      - name: Publish explicit preview version, never overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release'; exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Blender Asset Director $RELEASE_TAG (preview)" \
            --notes 'One-step local Codex skill installation. Includes a complete runtime, path detection, read-only first-run guidance, and protected updates. Python 3.11+, local Codex and an existing Blender MCP setup are prerequisites. Technical CI is not artistic or user-workstation acceptance. See README and docs/SETUP_ACCEPTANCE.md.'
  public-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate local configuration for public smoke test
        shell: python
        run: |
          import os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('BAD_CONFIG=' + str(base / 'bad-public' / 'runtime.json') + '\n')
              env.write('CODEX_HOME=' + str(base / 'codex-unconfigured') + '\n')
      - name: Install via public Windows bootstrap, no checkout or Git credentials
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'public-install.ps1'
          Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/raal1600/blender-asset-director/$env:RELEASE_TAG/install.ps1" -OutFile $installer
          & powershell -NoProfile -ExecutionPolicy Bypass -File $installer -SkillPath "$env:RUNNER_TEMP/installed-skill" -LibraryPath "$env:RUNNER_TEMP/CGI Library"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install via public POSIX bootstrap, no checkout or Git credentials
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' "https://raw.githubusercontent.com/raal1600/blender-asset-director/$RELEASE_TAG/install.sh" -o "$RUNNER_TEMP/public-install.sh"
          sh "$RUNNER_TEMP/public-install.sh" --dest "$RUNNER_TEMP/installed-skill" --library "$RUNNER_TEMP/CGI Library"
      - name: Verify installed runtime and offline removal
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          skill = base / 'installed-skill'
          subprocess.run([sys.executable, str(skill / 'scripts' / 'director.py'), 'doctor'], check=True)
          for operation in ('--verify', '--uninstall'):
              subprocess.run([sys.executable, str(skill / 'scripts' / 'manage_install.py'), '--dest', str(skill), operation], check=True)
          assert (base / 'CGI Library' / 'catalog.sqlite').is_file()
