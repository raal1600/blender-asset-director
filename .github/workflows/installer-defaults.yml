name: Published installer defaults
on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'chore/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-defaults-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published-default:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: python
          - os: ubuntu-latest
            shell: sh
          - os: macos-latest
            shell: sh
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual default HTTPS install, repeat, verify and uninstall
        run: python tools/published_install_smoke.py --shell ${{ matrix.shell }} --output published-install-evidence/default.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-default-${{ matrix.os }}-${{ matrix.shell }}
          path: published-install-evidence/
          retention-days: 14
          if-no-files-found: error
