name: Integrate reviewed local motion source
on:
  push:
    branches: [feature/local-motion-library]
    paths: ['.github/workflows/integrate-local-motion.yml']
permissions:
  contents: read
concurrency:
  group: integrate-local-motion
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/local-motion-library'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact patch bytes and scope before applying
        shell: python
        run: |
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          subprocess.run(['git','merge-base','--is-ancestor','6db5439445755cb21ea5255fcec5a9233c2002c8','HEAD'],check=True)
          parts=[Path('tools')/('_local_motion_v2_'+str(i)+'.txt') for i in range(5)]
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert len(packed)==31432
          assert hashlib.sha256(packed).hexdigest()=='fb8e88bf1b67c26492b435df1fd9ca26327f0f0671332f8e6214a20ca3685328'
          patch=lzma.decompress(packed,memlimit=256*1024*1024)
          assert len(patch)==114517
          assert hashlib.sha256(patch).hexdigest()=='f4b1cd4942200fa492b700e0f1d3efded3ce7410f638a66e1dcb60da9ab8ac0b'
          allowed={'.github/workflows/ci.yml','README.md','docs/LOCAL_MOTION_LIBRARY.md','install.ps1','install.py','install.sh','pyproject.toml','skills/blender-asset-director/SKILL.md','skills/blender-asset-director/references/local-motion-library.md','skills/blender-asset-director/references/providers.md','skills/blender-asset-director/references/roles/performance.md','src/asset_director/__init__.py','src/asset_director/blender_ops.py','src/asset_director/core.py','src/asset_director/jobs.py','src/asset_director/license_policy.py','src/asset_director/local_motion.py','src/asset_director/local_motion_cli.py','src/asset_director/motion.py','src/asset_director/motion_assets.py','src/asset_director/motion_blender.py','src/asset_director/motion_cli.py','src/asset_director/motion_scout.py','src/asset_director/native_clip.py','src/asset_director/providers.py','src/asset_director/worker.py','tests/test_local_motion.py','tools/local_motion_fixture.py'}
          headers=[line.split(' b/',1)[1] for line in patch.decode('utf-8').splitlines() if line.startswith('diff --git a/')]
          assert set(headers)==allowed and len(headers)==len(allowed)
          path=Path(os.environ['RUNNER_TEMP'])/'reviewed-local-motion.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--stat',str(path)],check=True)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
      - name: Offline tests and managed installer self-test
        run: python tools/run_checks.py --offline
      - name: Commit source and remove one-time transport
        shell: bash
        run: |
          git rm tools/_local_motion_v2_*.txt tools/_local_motion_patch_0.txt .github/workflows/integrate-local-motion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add read-only motion inboxes, reviewed Mixamo grants and native clip playback'
          git push origin HEAD:refs/heads/feature/local-motion-library
