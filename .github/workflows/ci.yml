name: 00 · Harness acceptance
'on':
  push:
    branches:
    - '**'
  pull_request: null
  merge_group: null
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Contracts and policies
    uses: ./.github/workflows/checks-portable.yml
  installation:
    name: 01 · Install and remove
    uses: ./.github/workflows/e2e-installation.yml
  onboarding:
    name: 02 · Create and audit a project
    uses: ./.github/workflows/e2e-project-onboarding.yml
  execution:
    name: 03 · Approve and execute a job
    uses: ./.github/workflows/e2e-project-execution.yml
  production:
    name: 04 · Author and preview a scene
    uses: ./.github/workflows/e2e-production.yml
  recovery:
    name: 05 · Refuse drift and recover
    uses: ./.github/workflows/e2e-project-recovery.yml
  studio:
    name: 06 · Full installed studio journey
    uses: ./.github/workflows/studio-e2e.yml
    with:
      scenario: full
  blender:
    name: Blender compatibility and deep regressions
    uses: ./.github/workflows/blender-regressions.yml
  launcher:
    name: Launcher contracts and Windows build
    uses: ./.github/workflows/launcher.yml
  showcase:
    name: 07 · Render to browser playback
    uses: ./.github/workflows/e2e-showcase.yml
  acceptance:
    name: Harness acceptance
    if: always()
    needs:
    - portable
    - installation
    - onboarding
    - execution
    - production
    - recovery
    - studio
    - blender
    - launcher
    - showcase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Collect this run's journey evidence
      uses: actions/download-artifact@v4
      with:
        pattern: acceptance-*
        path: acceptance-evidence
    - name: Reject failed, skipped, cancelled or missing dependencies
      if: always()
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      shell: python
      run: |
        import json, os, sys
        sys.path.insert(0, 'tools/ci')
        from verify_evidence import validate_needs
        validate_needs(json.loads(os.environ['NEEDS_JSON']))
    - name: Require all 23 exact-commit partitions and their artifact hashes
      run: python tools/ci/verify_evidence.py --root acceptance-evidence --commit "${{ github.sha }}"
    - name: Collect mandatory native desktop evidence
      uses: actions/download-artifact@v4
      with:
        name: native-desktop-${{ github.sha }}
        path: native-desktop-evidence
    - name: Verify native desktop report and exact-source attachments
      run: python tools/native_desktop_contract.py --root native-desktop-evidence --commit "${{ github.sha }}"
    - name: Report dependency results and acceptance boundaries
      if: always()
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      shell: python
      run: |
        import json, os
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
            out.write('## Harness acceptance\n\nCommit: `' + os.environ['GITHUB_SHA'] + '`\n\n')
            out.write('| Module | Result |\n|---|---|\n')
            for name, value in json.loads(os.environ['NEEDS_JSON']).items():
                out.write('| ' + name + ' | ' + value['result'] + ' |\n')
            out.write('\nA pass requires every dependency plus all 23 exact-commit evidence partitions and the native desktop report. '
                'See docs/CI_WORKFLOWS.md for the journey map. This does not certify authenticated model calls, '
                'live Blender add-on MCP, non-fixture native desktop use, private inputs, or artistic acceptance.\n')

  candidate:
    name: Package verified Windows candidate (not a release)
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v4
      with:
        name: workbench-windows-host-${{ github.sha }}
        path: candidate-host
    - uses: actions/download-artifact@v4
      with:
        name: native-desktop-${{ github.sha }}
        path: candidate-native
    - name: Verify source, tested host and native evidence before packaging
      run: python tools/package_workbench_candidate.py --output candidate/Asset-Director-Candidate.zip --host candidate-host --native candidate-native
    - uses: actions/upload-artifact@v4
      with:
        name: workbench-candidate-${{ github.sha }}
        path: candidate/
        if-no-files-found: error
        retention-days: 14
