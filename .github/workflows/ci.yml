name: Asset Director Tests
on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'chore/**', 'docs/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: asset-director-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and policy tests (no network)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Current documentation and unit gate summary
        if: always()
        shell: bash
        run: |
          echo '## Portable tests and contributor documentation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: `${{ github.sha }}` · OS: `${{ matrix.os }}` · Python: `${{ matrix.python }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Result so far: **${{ job.status }}**. Exact totals and skips are in the unit-test log.' >> "$GITHUB_STEP_SUMMARY"
      - name: Skill installation round trip
        run: python tools/install_skill.py --self-test
      - name: Dry-run manifest-bound branch cleanup
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11' && github.repository == 'raal1600/blender-asset-director'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/cleanup_merged_branches.py --target-sha "${{ github.sha }}" --dry-run
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: branch-cleanup-dry-run
          path: cleanup-evidence/
          retention-days: 30
          if-no-files-found: warn
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        blender: ['4.5.3', '5.0.0', '5.2.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch checksum-verified official Blender
        run: |
          python tools/fetch_blender.py '${{ matrix.blender }}' "$RUNNER_TEMP/blender" > blender-path.txt
          echo "BLENDER=$(tail -n 1 blender-path.txt)" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
      - name: Acquire pinned retarget backend
        run: python -m asset_director --library "$RUNNER_TEMP/bad-library" backend-install
      - name: Actual Blender import, retarget and NLA fixtures
        run: |
          mkdir -p evidence
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/headless_fixture.py -- "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/fixtures/fixture_report.json" evidence/
      - name: Generic studio multi-scene and rig-free preview regression
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/studio_fixture.py -- "$RUNNER_TEMP/studio-fixtures"
          cp "$RUNNER_TEMP/studio-fixtures/studio_report.json" evidence/
      - name: Animated camera authoring, camera-check sampling and preview-settings regression
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/camera_fixture.py -- "$RUNNER_TEMP/camera-fixtures"
          cp "$RUNNER_TEMP/camera-fixtures/camera_report.json" evidence/
      - name: Lighting and look-development authoring regression
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/look_fixture.py -- "$RUNNER_TEMP/look-fixtures"
          cp "$RUNNER_TEMP/look-fixtures/look_report.json" evidence/
      - name: Evaluated pose, sole topology and bounded floor regressions
        shell: bash
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/test_pose_transfer_blender.py | tee evidence/evaluated-pose.log
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/test_floor_blender.py | tee evidence/floor-contact.log
      - name: Retarget timebase, grounding, fractional NLA and presentation job chain
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/retarget_pipeline_fixture.py -- "$RUNNER_TEMP/pipeline-fixtures" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/pipeline-fixtures/retarget_pipeline_report.json" evidence/
      - name: Canonical motion, clay morphology and reviewed retarget bridge
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/motion_foundation_fixture.py -- "$RUNNER_TEMP/motion-foundation" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/motion-foundation/motion_foundation_report.json" evidence/
      - name: Evaluated clay skin, root/controller exclusion and landmark attachments
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/proxy_visual_fixture.py -- "$RUNNER_TEMP/proxy-visual" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/proxy-visual/proxy_visual_report.json" evidence/
          cp "$RUNNER_TEMP/proxy-visual/"proxy-*.png evidence/
      - name: Read-only animation inbox, reviewed Mixamo policy and native FBX playback
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/local_motion_fixture.py -- "$RUNNER_TEMP/local-motion" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/local-motion/local_motion_report.json" evidence/
      - name: Reviewed transfer planning, numbered chains, fingers and subframe sole diagnostics
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/transfer_planning_fixture.py -- "$RUNNER_TEMP/transfer-planning" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/transfer-planning/transfer_planning_report.json" evidence/
      - name: Reviewed transfer with custom target roles
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/transfer_planning_fixture.py -- "$RUNNER_TEMP/transfer-custom" "$RUNNER_TEMP/bad-library" custom
          cp "$RUNNER_TEMP/transfer-custom/transfer_planning_report.json" evidence/transfer_custom_report.json
      - name: Reviewed bone display and widget preservation
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/bone_display_fixture.py -- "$RUNNER_TEMP/bone-display" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/bone-display/REPORT.json" evidence/bone_display_report.json
      - name: Bounded subframe grounding, rotation preservation and total correction cap
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/ground_contact_fixture.py -- "$RUNNER_TEMP/ground-contact"
          cp "$RUNNER_TEMP/ground-contact/ground_contact_report.json" evidence/
      - name: Physical source-translation precision and genuine extra-motion rejection
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/translation_precision_fixture.py -- "$RUNNER_TEMP/translation-precision"
          cp "$RUNNER_TEMP/translation-precision/translation_precision_report.json" evidence/
      - name: Connected FBX anchor detection and travelling source roundtrip
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/fbx_anchor_fixture.py -- "$RUNNER_TEMP/fbx-anchor"
          cp "$RUNNER_TEMP/fbx-anchor/fbx_anchor_report.json" evidence/
      - name: Imported action labels, owned slots and identical reference preservation
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/action_collision_fixture.py -- "$RUNNER_TEMP/collision"
          cp "$RUNNER_TEMP/collision/action_collision_report.json" evidence/
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/reference_identity_fixture.py -- "$RUNNER_TEMP/reference" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/reference/reference_identity_report.json" evidence/
      - name: Full long-take sequence, root alignment, bridge and reviewed-role QA
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 11 --python tools/sequence_fixture.py -- "$RUNNER_TEMP/sequence" "$RUNNER_TEMP/bad-library"
          cp "$RUNNER_TEMP/sequence/sequence_report.json" evidence/
      - name: Preserve sequence progress on failure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sequence/sequence_progress.json" ]; then cp "$RUNNER_TEMP/sequence/sequence_progress.json" evidence/; fi
          if [ -f "$RUNNER_TEMP/sequence/sequence_failure.json" ]; then cp "$RUNNER_TEMP/sequence/sequence_failure.json" evidence/; fi
      - name: Collect diagnostic reports (no source assets or secrets)
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/worker-logs
          find "$RUNNER_TEMP/bad-library/jobs" -name worker.log -exec sh -c 'cp "$1" "evidence/worker-logs/$(basename "$(dirname "$1")").log"' sh {} \; 2>/dev/null || true
          rm -f evidence/*.blend evidence/*.blend1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-${{ matrix.blender }}-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  live-provider-acceptance:
    name: live provider acceptance (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch checksum-verified Blender 5.0.0
        run: |
          python tools/fetch_blender.py '5.0.0' "$RUNNER_TEMP/blender" > blender-path.txt
          echo "BLENDER=$(tail -n 1 blender-path.txt)" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
      - name: Acquire pinned retarget backend
        run: python -m asset_director --library "$RUNNER_TEMP/bad-library" backend-install
      - name: Live free asset acquisition and real-motion retarget
        run: python tools/cloud_acceptance.py "$BLENDER" "$RUNNER_TEMP/bad-library" evidence
      - name: Explain informational status
        if: always()
        shell: bash
        run: |
          echo '## Live provider acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is an **informational network-dependent check**. Provider/network outages remain visible in logs and artifacts but do not make deterministic Blender CI red.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A successful run is still required before making a new claim that live provider acceptance passed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-provider-acceptance-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: sh
          - os: macos-latest
            shell: sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real bootstrap install, repeat, update, health and uninstall
        run: python tools/bootstrap_smoke.py --shell ${{ matrix.shell }}
