name: Prepare contact-reporting regression
on:
  push:
    branches: [chore/consolidate-main-20260915]
    paths: [.github/workflows/prepare-contact-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare exact reviewed replacements without updating branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, urllib.request
          replacements = {
            'src/asset_director/sequence_blender.py': [
              ('from .core import require, digest, atomic_json, load_json', 'from .core import require, digest, atomic_json, load_json\nfrom .contact_status import sequence_status'),
              ("'contact_status':('NOT_MEASURED' if cfg is None else\n                'SAMPLED_PENETRATION' if any(c['status']=='PENETRATION_DETECTED' for c in contact) else 'REVIEW_MEASURED_EXTREMA')", "'contact_status':sequence_status(contact, cfg is not None)")],
            'tools/sequence_fixture.py': [
              ("        track=target.animation_data.nla_tracks.get(manifest['strips'][0]['track']);track.strips[0].influence=.5", """        # Read-only diagnostic with a deliberately raised floor must retain its warning.
                  penetrating = copy.deepcopy(manifest)
                  penetrating['request']['contact']['ground_z'] += 10
                  penetrating['contact_frames'] = manifest['contact_frames'][:3]
                  before_contact = sb.snapshot(target)
                  warned = sb.check(target, penetrating)
                  assert warned['contact_batches'] and all(c['status'] == 'SAMPLED_PENETRATION' for c in warned['contact_batches'])
                  assert warned['contact_status'] == 'SAMPLED_PENETRATION'
                  assert sb.snapshot(target) == before_contact
                  passed('actual penetrating mesh samples retain the aggregate warning without modifying the sequence')
                  track=target.animation_data.nla_tracks.get(manifest['strips'][0]['track']);track.strips[0].influence=.5""".replace('\n                  ', '\n        '))]}
          out = Path('prepared-contact-fix'); out.mkdir()
          entries = []
          for path, pairs in replacements.items():
              original = Path(path).read_text(); content = original
              for old, new in pairs:
                  assert content.count(old) == 1, path
                  content = content.replace(old, new)
              compile(content, path, 'exec')
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=json.dumps({'encoding':'utf-8','content':content}).encode(), method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response: blob = json.load(response)
              entries.append({'path':path, 'mode':'100644', 'type':'blob', 'sha':blob['sha']})
              p = out/path; p.parent.mkdir(parents=True, exist_ok=True); p.write_text(content)
          (out/'entries.json').write_text(json.dumps(entries, indent=2))
          print(json.dumps(entries))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('# Prepared source-only contact fix\n\nNo branch was changed; no test pass claimed. Apply these exact blobs, remove this temporary workflow, then run the complete matrix.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-contact-fix
          path: prepared-contact-fix/
          retention-days: 14
          if-no-files-found: error
