name: Prepare reviewed consolidation
on:
  push:
    branches: [chore/consolidate-main-20260915]
    paths: [.github/workflows/assemble-consolidation.yml, .github/consolidation_apply.py]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'raal1600/blender-asset-director'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble exact branch histories in isolated checkout
        env:
          PAGES: a52eaf72651cc82455f182f59a9cb5be2095ce3d
          ORIGINAL_MAIN: fc73cbfa429be158dea624f5d10aa801c12af374
          IDENTITY: d61f56f90aad0c604b03720464f7d057bc987112
        run: |
          git config user.name 'Rami Halabi'
          git config user.email '49195844+raal1600@users.noreply.github.com'
          git merge --no-ff "$PAGES" -m 'Preserve synthetic Transition Lab history'
          git merge --no-ff "$ORIGINAL_MAIN" -m 'Preserve existing main history'
          if ! git merge --no-ff "$IDENTITY" -m 'Preserve identity-reference branch history'; then
            test "$(git diff --name-only --diff-filter=U)" = 'src/asset_director/transfer_blender.py'
            git checkout --ours src/asset_director/transfer_blender.py
            git add src/asset_director/transfer_blender.py
            git commit -m 'Retain physical-unit solver before adding reviewed identity fast path'
          fi
          python .github/consolidation_apply.py
          git rm .github/consolidation_apply.py .github/workflows/assemble-consolidation.yml
          git add -A
          mkdir -p "$RUNNER_TEMP/prepared"
          git diff --cached "$GITHUB_SHA" > "$RUNNER_TEMP/prepared/integration.patch"
          git diff --cached --stat "$GITHUB_SHA" > "$RUNNER_TEMP/prepared/changes.txt"
          git archive --format=zip --output="$RUNNER_TEMP/prepared/source.zip" "$(git write-tree)"
      - name: Store prepared Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          def api(path,payload):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path,
                  data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          base=os.environ['GITHUB_SHA']; entries=[]
          for row in git('diff','--cached','--name-status','--no-renames',base).splitlines():
              status,path=row.split('\t')
              if status=='D':entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              else:
                  mode,local_sha,_=git('ls-files','--stage','--',path).split()[:3]
                  blob=api('git/blobs',{'encoding':'utf-8','content':Path(path).read_text()})
                  assert blob['sha']==local_sha,path
                  entries.append({'path':path,'mode':mode,'type':'blob','sha':blob['sha']})
          tree=api('git/trees',{'base_tree':git('rev-parse',base+'^{tree}'),'tree':entries})
          assert tree['sha']==git('write-tree')
          parents=[base,'a52eaf72651cc82455f182f59a9cb5be2095ce3d','fc73cbfa429be158dea624f5d10aa801c12af374','d61f56f90aad0c604b03720464f7d057bc987112']
          commit=api('git/commits',{'message':'Consolidate all development histories, repair imported-slot identity and document tested main','tree':tree['sha'],'parents':parents})
          result={'sha':commit['sha'],'tree':tree['sha'],'parents':parents,'status':'PREPARED_NOT_TESTED','branch_mutations':False}
          out=Path(os.environ['RUNNER_TEMP'])/'prepared/prepared-commit.json';out.write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Prepared consolidation\n\nCommit: `'+commit['sha']+'`\n\nNo branch was moved. No tests are claimed. The connector must advance only the temporary branch, then run Actions before any main merge.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-consolidation-${{ github.sha }}
          path: ${{ runner.temp }}/prepared/
          retention-days: 30
          if-no-files-found: error
